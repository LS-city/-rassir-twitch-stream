<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON HARVEST Rooftop Arena - Stream Scene</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05040a;font-family:"Courier New",monospace;color:#e9e6ff}
  canvas{display:block}
  #panel{position:fixed;top:14px;left:14px;width:300px;max-height:calc(100% - 28px);overflow:auto;background:rgba(10,8,22,.92);border:1px solid #ff2bd6;border-radius:10px;padding:14px;z-index:5;font-size:13px}
  #panel.hidden{display:none}
  .hd{font-weight:bold;font-size:15px;color:#22e6ff;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .hd span{font-size:11px;color:#a49ccc;font-weight:normal}
  #panel label.t{display:block;margin:12px 0 5px;color:#ff8be9;font-size:12px}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
  input[type=text],select{flex:1;min-width:0;width:100%;box-sizing:border-box;background:#141028;color:#fff;border:1px solid #3d2f6e;border-radius:6px;padding:7px;font-family:inherit;font-size:13px}
  button{background:#1b1435;color:#fff;border:1px solid #22e6ff;border-radius:6px;padding:7px 9px;font-family:inherit;font-size:12px;cursor:pointer}
  button:hover{background:#2a1f55}
  button.on{background:#22e6ff;color:#07060d}
  .shots{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
  .ck{display:flex;align-items:center;gap:5px;color:#d8d2ff;font-size:12px;cursor:pointer}
  #status{margin-top:12px;font-size:11px;color:#9dff3a;min-height:14px;line-height:1.4}
  .hint{font-size:11px;color:#8d86b5;margin-top:10px;line-height:1.5}
  body.nocursor{cursor:none}
</style>
</head>
<body>
<div id="panel">
  <div class="hd">ROOFTOP ARENA <span>H = hide</span></div>

  <label class="t">Twitch channel (live chat + alerts)</label>
  <div class="row"><input type="text" id="chan" placeholder="yourchannel"><button id="chanGo">Connect</button></div>

  <label class="t">Gameplay screen (big)</label>
  <select id="srcGame"></select>
  <label class="t">Live cam screen</label>
  <select id="srcCam"></select>
  <div class="row">
    <button id="allow">Find cameras</button>
    <label class="ck"><input type="checkbox" id="mirror"> Mirror cam</label>
  </div>

  <div class="hint" style="margin-top:6px">Keys: C = next cam source, G = next gameplay source</div>
  <label class="t">Camera shot (keys 1-8)</label>
  <div class="shots" id="shots"></div>
  <div class="row"><label class="ck"><input type="checkbox" id="auto"> Auto-switch shots every 20s</label></div>

  <label class="t">Helipad fight ring</label>
  <div class="row">
    <button id="round">Round start (F)</button>
    <button id="testAlert">Test alert (T)</button>
  </div>
  <div class="row">
    <label class="ck"><input type="checkbox" id="fighters" checked> Fighters in ring</label>
    <label class="ck"><input type="checkbox" id="chatFight" checked> !fight from chat</label>
  </div>

  <label class="t">Fighters + win/loss records</label>
  <input type="text" id="p1" placeholder="Pink fighter username" style="border-color:#ff2bd6">
  <div class="row"><input type="text" id="p2" placeholder="Cyan fighter username" style="border-color:#22e6ff"></div>
  <div class="row">
    <button id="w1" style="border-color:#ff2bd6">Pink wins (Q)</button>
    <button id="w2">Cyan wins (E)</button>
  </div>
  <div class="row">
    <button id="swap">Swap sides</button>
    <button id="undo">Undo last</button>
    <button id="resetRec">Reset records</button>
  </div>
  <div id="board" class="hint"></div>

  <div id="status">Ready.</div>
  <div class="hint">Gameplay tip: pick "Share a screen or window" and choose your game window. Then press H to hide this panel and capture this window in OBS.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const store={get(k,d){try{const v=localStorage.getItem('nha_'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('nha_'+k,JSON.stringify(v));}catch(e){}}};
const setStatus=m=>{$('status').textContent=m;};

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x04030a);
scene.fog=new THREE.Fog(0x05040a,22,85);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,200);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

const B=(c,o)=>new THREE.MeshBasicMaterial(Object.assign({color:c},o||{}));
const ADD={transparent:true,blending:THREE.AdditiveBlending,depthWrite:false};
const softTex=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'#fff');g.addColorStop(0.55,'#888');g.addColorStop(1,'#000');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);})();
const PINK='#ff2bd6',CYAN='#22e6ff',LIME='#9dff3a',AMBER='#ffb02e',VIOLET='#a46bff';

const grid=new THREE.GridHelper(28,28,0x3a1a5a,0x1c1233);grid.position.set(0,0.01,-2);scene.add(grid);
const ledge=new THREE.Mesh(new THREE.BoxGeometry(28,0.06,0.06),B(0x22e6ff));ledge.position.set(0,0.4,10);scene.add(ledge);
[[-10,6],[-8.2,6],[-6.4,6],[10,7],[11.6,7]].forEach(([x,z])=>{const v=new THREE.Mesh(new THREE.BoxGeometry(1.4,1,1.4),B(0x1a1430));v.position.set(x,0.5,z);scene.add(v);

const stageGlow=new THREE.Mesh(new THREE.PlaneGeometry(13,13),B(0xff2bd6,Object.assign({opacity:.14,alphaMap:softTex},ADD)));stageGlow.rotation.x=-Math.PI/2;stageGlow.position.y=-0.27;stage.add(stageGlow);
const posts=[];for(let i=0;i<6;i++){const a=i/6*Math.PI*2;posts.push([Math.cos(a)*4,Math.sin(a)*4]);}
posts.forEach((p,i)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,1.7,10),B(i%2?0x22e6ff:0xff2bd6));m.position.set(p[0],0.85,p[1]);stage.add(m);
  const cap=new THREE.Mesh(new THREE.SphereGeometry(0.15,12,8),B(0xffffff));cap.position.set(p[0],1.75,p[1]);stage.add(cap);});
[0.55,1.05,1.5].forEach((y,r)=>{const pts=posts.concat([posts[0]]).map(p=>new THREE.Vector3(p[0],y,p[1]));
  stage.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:[0xff2bd6,0xffffff,0x22e6ff][r]})));});
const fighters=[];
[[-1.1,0xff2bd6],[1.1,0x22e6ff]].forEach(([x,c])=>{
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(0.5,1,0.32),B(c));body.position.y=0.5;
  const head=new THREE.Mesh(new THREE.BoxGeometry(0.36,0.36,0.36),B(c));head.position.y=1.22;
  const fist=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,0.2),B(0xffffff));fist.position.set(x<0?0.38:-0.38,0.75,0);
  g.add(body,head,fist);g.position.x=x;g.userData={x,fist};stage.add(g);fighters.push(g);
});
const ringSpot=new THREE.Mesh(new THREE.ConeGeometry(4,10,40,1,true),B(0xffffff,Object.assign({opacity:.05,side:THREE.DoubleSide},ADD)));ringSpot.position.set(0,5.3,-3);scene.add(ringSpot);

const spots=[];
[[-13,-13,0xff2bd6],[13,-13,0x22e6ff],[-13,9,0x22e6ff],[13,9,0xff2bd6]].forEach(([x,z,c])=>{
  const pivot=new THREE.Group();pivot.position.set(x,0,z);scene.add(pivot);
  const beam=new THREE.Mesh(new THREE.ConeGeometry(2.2,40,24,1,true),B(c,Object.assign({opacity:.05,side:THREE.DoubleSide},ADD)));
  beam.rotation.x=Math.PI;beam.position.y=20;pivot.add(beam);
  const lamp=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.5,0.5,12),B(0x2a2045));lamp.position.y=0.25;pivot.add(lamp);
  spots.push(pivot);
});

let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
const towerMat=B(0x0a0816);
function building(x,z,w,h,d){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),towerMat);m.position.set(x,h/2-30,z);scene.add(m);
  const wc=document.createElement('canvas');wc.width=64;wc.height=160;const wx=wc.getContext('2d');wx.fillStyle='#0a0816';wx.fillRect(0,0,64,160);
  for(let yy=4;yy<160;yy+=8)for(let xx=4;xx<64;xx+=8)if(rnd()<0.28){wx.fillStyle=['#ff2bd6','#22e6ff','#ffb02e','#6b5cff'][Math.floor(rnd()*4)];wx.globalAlpha=0.3+rnd()*0.5;wx.fillRect(xx,yy,4,4);}
  const f=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(wc)}));f.position.set(x,h/2-30,z+d/2+0.02);scene.add(f);
}
for(let i=0;i<26;i++){building(-75+i*6+(rnd()-.5)*2,-40-rnd()*18,4+rnd()*2.5,26+rnd()*34,4);}
building(-20,-18,9,44,7);building(19,-12.5,8,46,6);

const RN=1100,rainGeo=new THREE.BufferGeometry(),rainPos=new Float32Array(RN*6);
for(let i=0;i<RN;i++){const x=(Math.random()-.5)*60,y=Math.random()*32,z=(Math.random()-.5)*44-4;rainPos.set([x,y,z,x-0.05,y-0.7,z],i*6);}
rainGeo.setAttribute('position',new THREE.BufferAttribute(rainPos,3));
scene.add(new THREE.LineSegments(rainGeo,new THREE.LineBasicMaterial(Object.assign({color:0x7a8cff,opacity:.32},ADD))));

function textPlane(text,w,col,fontPx){
  const c=document.createElement('canvas');c.width=1024;c.height=Math.round(1024*0.16);
  const x=c.getContext('2d');x.font='bold '+fontPx+'px "Courier New",monospace';x.textAlign='center';x.textBaseline='middle';
  x.shadowColor=col;x.shadowBlur=30;x.fillStyle=col;x.fillText(text,512,c.height/2);x.shadowBlur=0;x.fillStyle='#ffffff';x.globalAlpha=.85;x.fillText(text,512,c.height/2);
  return new THREE.Mesh(new THREE.PlaneGeometry(w,w*0.16),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));
}
const sign=textPlane('NEON HARVEST',15,PINK,120);sign.position.set(-20,16.6,-14.4);scene.add(sign);
const sign2=textPlane('ROOFTOP ARENA',12,CYAN,110);sign2.position.set(0,19.6,-15);scene.add(sign2);
[-6,6].forEach(x=>{const s=new THREE.Mesh(new THREE.BoxGeometry(0.5,8,0.5),B(0x1a1430));s.position.set(x,4,-15.4);scene.add(s);});
const camPole=new THREE.Mesh(new THREE.BoxGeometry(0.35,5.1,0.35),B(0x1a1430));camPole.position.set(14,2.55,-9.6);scene.add(camPole);

const screens={};
function makeScreen(id,o){
  const g=new THREE.Group();g.position.set(...o.pos);scene.add(g);g.lookAt(new THREE.Vector3(...o.look));
  const c=document.createElement('canvas');c.width=o.cw;c.height=Math.round(o.cw*o.h/o.w);
  const ctex=new THREE.CanvasTexture(c);
  const mat=new THREE.MeshBasicMaterial(o.holo?{map:ctex,transparent:true,opacity:1,side:THREE.DoubleSide,depthWrite:false}:{map:ctex});
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(o.w,o.h),mat);g.add(mesh);
  if(o.holo){
    g.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(o.w+0.1,o.h+0.1)),new THREE.LineBasicMaterial({color:new THREE.Color(o.col)})));
    const base=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.6,0.25,20),B(0x1a1430));base.position.set(o.pos[0],0.12,o.pos[2]);scene.add(base);
    const beamUp=new THREE.Mesh(new THREE.CylinderGeometry(o.w*0.35,0.45,o.pos[1]-o.h/2-0.2,20,1,true),B(o.col,Object.assign({opacity:.08,side:THREE.DoubleSide},ADD)));
    beamUp.position.set(o.pos[0],(o.pos[1]-o.h/2)/2+0.1,o.pos[2]);scene.add(beamUp);
  }else{
    const frame=new THREE.Mesh(new THREE.PlaneGeometry(o.w+0.3,o.h+0.3),B(o.col));frame.position.z=-0.02;g.add(frame);
    const back=new THREE.Mesh(new THREE.BoxGeometry(o.w+0.36,o.h+0.36,0.25),B(0x0b0915));back.position.z=-0.16;g.add(back);
  }
  const glowMat=B(o.col,Object.assign({opacity:o.holo?.18:.3,alphaMap:softTex},ADD));
  const glow=new THREE.Mesh(new THREE.PlaneGeometry(o.w+3,o.h+3),glowMat);glow.position.z=-0.3;g.add(glow);
  const tc=document.createElement('canvas');tc.width=512;tc.height=96;const tx=tc.getContext('2d');
  tx.font='bold 54px "Courier New",monospace';const tw=Math.min(512,tx.measureText(o.label).width+48);
  tx.fillStyle=o.col;tx.fillRect(0,0,tw,96);tx.fillStyle='#07060d';tx.textBaseline='middle';tx.fillText(o.label,24,52);
  const tagW=Math.min(o.w*0.55,3),tagH=tagW*96/512;
  const tag=new THREE.Mesh(new THREE.PlaneGeometry(tagW,tagH),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(tc),transparent:true,side:THREE.DoubleSide}));
  tag.position.set(-o.w/2+tagW/2-0.12,o.h/2+0.16+tagH/2,0.01);g.add(tag);
  const s=Object.assign({id,tagH,g,mesh,mat,c,ctx:c.getContext('2d'),ctex,glowMat,video:null,vtex:null,stream:null,fitted:false,baseY:o.pos[1]},o);
  if(o.live){const dot=new THREE.Mesh(new THREE.CircleGeometry(tagH*0.28,20),B(0xff3030));dot.position.set(-o.w/2+tagW+0.12,o.h/2+0.16+tagH/2,0.01);g.add(dot);s.dot=dot;}
  screens[id]=s;return s;
}
makeScreen('game',{label:'GAMEPLAY',col:CYAN,pos:[0,13,-15],look:[0,8,10],w:18,h:10.125,cw:1280});
makeScreen('cam',{label:'LIVE CAM',col:PINK,pos:[14,7,-9],look:[0,4,6],w:5.2,h:2.925,cw:640,live:true});
makeScreen('chat',{label:'CHAT',col:LIME,pos:[-9.5,4.4,-2],look:[0,3.5,8],w:3.6,h:4.6,cw:480,holo:true});
makeScreen('alerts',{label:'ALERTS',col:AMBER,pos:[9.2,3.8,0],look:[0,3.5,8],w:4,h:2.25,cw:640,holo:true});
makeScreen('info',{label:'STREAM INFO',col:CYAN,pos:[-22.3,12,-14.45],look:[-22.3,12,10],w:4.2,h:2.3625,cw:640});
makeScreen('brand',{label:'NEON HARVEST',col:PINK,pos:[-17.7,12,-14.45],look:[-17.7,12,10],w:4.2,h:2.3625,cw:640});
makeScreen('score',{label:'SCOREBOARD',col:PINK,pos:[0,5.6,-14.9],look:[0,4,10],w:8,h:2.6,cw:1024});
makeScreen('viz',{label:'VISUALIZER',col:VIOLET,pos:[19,11.4,-9.4],look:[19,11.4,10],w:6,h:3.375,cw:640});

const rc=document.createElement('canvas');rc.width=1024;rc.height=256;const rctx=rc.getContext('2d');
const rtex=new THREE.CanvasTexture(rc);
const roundMesh=new THREE.Mesh(new THREE.PlaneGeometry(8,2),new THREE.MeshBasicMaterial({map:rtex,transparent:true,depthTest:false,depthWrite:false}));
roundMesh.renderOrder=10;roundMesh.visible=false;roundMesh.position.set(0,3.4,-1.4);scene.add(roundMesh);
let roundNum=0,roundStart=-99,roundPhase='',winT=-99,winText='',winCol=PINK;
function drawRoundText(txt,col){
  rctx.clearRect(0,0,1024,256);let fs=150;rctx.font='bold '+fs+'px "Courier New",monospace';while(rctx.measureText(txt).width>960&&fs>50){fs-=6;rctx.font='bold '+fs+'px "Courier New",monospace';}rctx.textAlign='center';rctx.textBaseline='middle';
  rctx.lineWidth=14;rctx.strokeStyle='#07060d';rctx.strokeText(txt,512,128);
  rctx.shadowColor=col;rctx.shadowBlur=40;rctx.fillStyle=col;rctx.fillText(txt,512,128);rctx.shadowBlur=0;
  rtex.needsUpdate=true;
}
let now=0;
function triggerRound(){roundNum++;roundStart=now;roundPhase='';setStatus('Round '+roundNum+'!');}

const alertQueue=[];let curAlert=null,alertStart=0;
function pushAlert(kind,name,text){alertQueue.push({kind,name,text:text||''});}

const chat=[];
const nameColors=[PINK,CYAN,LIME,AMBER,VIOLET,'#ff6b6b','#5effc8'];
function hashCol(n){let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))>>>0;return nameColors[h%nameColors.length];}

function wrapLines(ctx,words,maxW){
  const lines=[];let line='';
  words.forEach(w=>{const test=line?line+' '+w:w;if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=w;}else line=test;});
  if(line)lines.push(line);return lines;
}
function drawChat(s,t){
  const {ctx,c}=s,w=c.width,h=c.height;
  ctx.fillStyle='#0a0814';ctx.fillRect(0,0,w,h);
  ctx.font='bold 24px "Courier New",monospace';
  if(!chat.length){
    ctx.fillStyle='#6f6896';ctx.textAlign='center';
    const msg=chanName?('Waiting for chat in #'+chanName+'...'):'Enter your Twitch channel in the panel to show live chat';
    wrapLines(ctx,msg.split(' '),w-60).forEach((l,i)=>ctx.fillText(l,w/2,h/2-30+i*32));
    ctx.textAlign='left';s.ctex.needsUpdate=true;return;
  }
  const lh=31;let y=h-18;
  for(let i=chat.length-1;i>=0&&y>30;i--){
    const m=chat[i];const words=(m.name+': '+m.msg).split(' ');
    const lines=wrapLines(ctx,words,w-32);
    for(let j=lines.length-1;j>=0&&y>30;j--){
      let x=16;
      if(j===0){const nm=m.name+':';ctx.fillStyle=m.color;ctx.fillText(nm,x,y);x+=ctx.measureText(nm+' ').width;ctx.fillStyle='#f2efff';ctx.fillText(lines[0].slice(nm.length+1),x,y);}
      else{ctx.fillStyle='#f2efff';ctx.fillText(lines[j],x,y);}
      y-=lh;
    }
    y-=6;
  }
  s.ctex.needsUpdate=true;
}

function drawGameDemo(s,t){
  const {ctx,c}=s,w=c.width,h=c.height;
  ctx.fillStyle='#120a22';ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#24113f';for(let i=0;i<10;i++){const bh=120+((i*53)%140);ctx.fillRect(i*120+((t*30)%120)-120,h*0.78-bh,80,bh);}
  ctx.fillStyle='#3a1a5a';ctx.fillRect(0,h*0.78,w,h*0.22);
  ctx.strokeStyle=PINK;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,h*0.78);ctx.lineTo(w,h*0.78);ctx.stroke();
  const hp1=0.4+0.6*Math.abs(Math.sin(t*0.3)),hp2=0.4+0.6*Math.abs(Math.cos(t*0.37));

function fitVideo(s){

  const va=v.videoWidth/v.videoHeight,sa=s.w/s.h;let rx=1,ry=1;
  if(va>sa)rx=sa/va;else ry=va/sa;

}

let ws=null,chanName='',lastChatFight=-99,reconnectTimer=null;
const unesc=v=>(v||'').replace(/\\s/g,' ').replace(/\\:/g,';').replace(/\\\\/g,'\\').replace(/\\r|\\n/g,'');
function parseIRC(line){
  let tags={},rest=line;
  if(rest[0]==='@'){const i=rest.indexOf(' ');rest.slice(1,i).split(';').forEach(kv=>{const j=kv.indexOf('=');tags[kv.slice(0,j)]=kv.slice(j+1);});rest=rest.slice(i+1);}
  let prefix='';if(rest[0]===':'){const i=rest.indexOf(' ');prefix=rest.slice(1,i);rest=rest.slice(i+1);}
  let trailing='';const ti=rest.indexOf(' :');if(ti>=0){trailing=rest.slice(ti+2);rest=rest.slice(0,ti);}
  const parts=rest.split(' ');return {tags,prefix,command:parts[0],trailing};
}
function handleLine(line){
  if(!line)return;const m=parseIRC(line);
  if(m.command==='PING'){ws.send('PONG :'+m.trailing);return;}
  if(m.command==='JOIN'){setStatus('Live chat connected: #'+chanName);return;}
  if(m.command==='PRIVMSG'){
    const name=unesc(m.tags['display-name'])||m.prefix.split('!')[0];
    let msg=m.trailing;if(msg.startsWith('\u0001ACTION ')){msg=msg.slice(8).replace(/\u0001$/,'');}
    chat.push({id:m.tags.id,user:m.prefix.split('!')[0],name,color:m.tags.color||hashCol(name),msg});
    if(chat.length>40)chat.shift();
    if(m.tags.bits)pushAlert(m.tags.bits+' BITS',name,msg);
    if(opts.chatFight&&msg.trim().toLowerCase()==='!fight'&&now-lastChatFight>30){lastChatFight=now;triggerRound();}
    return;
  }
  if(m.command==='USERNOTICE'){
    const id=m.tags['msg-id'],name=unesc(m.tags['display-name'])||'Someone',sys=unesc(m.tags['system-msg']);
    const kinds={sub:'NEW SUB',resub:'RESUB',subgift:'GIFT SUB',submysterygift:'GIFT SUBS',raid:'RAID!',primepaidupgrade:'NEW SUB',giftpaidupgrade:'NEW SUB'};
    if(kinds[id])pushAlert(kinds[id],name,sys);
    return;
  }
  if(m.command==='CLEARCHAT'){
    if(m.trailing){for(let i=chat.length-1;i>=0;i--)if(chat[i].user===m.trailing)chat.splice(i,1);}else chat.length=0;return;
  }
  if(m.command==='CLEARMSG'){const tid=m.tags['target-msg-id'];const i=chat.findIndex(c=>c.id===tid);if(i>=0)chat.splice(i,1);}
}
function connectChat(name){
  chanName=(name||'').toLowerCase().replace(/[^a-z0-9_]/g,'');store.set('chan',chanName);$('chan').value=chanName;
  clearTimeout(reconnectTimer);
  if(ws){ws.onclose=null;try{ws.close();}catch(e){}ws=null;}
  chat.length=0;
  if(!chanName){setStatus('Chat disconnected.');return;}
  setStatus('Connecting to #'+chanName+'...');
  ws=new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  const me=ws;
  ws.onopen=()=>{me.send('CAP REQ :twitch.tv/tags twitch.tv/commands');me.send('PASS SCHMOOPIIE');me.send('NICK justinfan'+Math.floor(10000+Math.random()*80000));me.send('JOIN #'+chanName);};
  ws.onmessage=e=>String(e.data).split('\r\n').forEach(handleLine);
  ws.onclose=()=>{if(ws!==me)return;setStatus('Chat disconnected. Retrying...');reconnectTimer=setTimeout(()=>connectChat(chanName),4000);};
}

function loop(){
  const dt=Math.min(clock.getDelta(),0.1);now+=dt;const t=now;

  if(opts.auto&&t-lastAuto>20){lastAuto=t;autoIdx=(autoIdx+1)%autoOrder.length;setShot(autoOrder[autoIdx]);}
  const S=SHOTS[shot];if(S.screen)frameScreen(screens[S.screen],goalP,goalT);else{goalP.copy(S.p);goalT.copy(S.t);}
  if(shot==='orbit'){goalP.set(Math.sin(t*0.1)*13,6+Math.sin(t*0.2)*1.5,-2+Math.cos(t*0.1)*14);}
  const k=1-Math.exp(-dt*(S.screen?3:2.2));curP.lerp(goalP,k);curT.lerp(goalT,k);
  const bob=S.screen?0:1;
  camera.position.set(curP.x+Math.sin(t*0.7)*0.05*bob,curP.y+Math.sin(t*0.9)*0.04*bob,curP.z);
  camera.lookAt(curT);

  fighters.forEach((f,i)=>{f.visible=opts.fighters;const d=i?-1:1;f.position.x=f.userData.x+Math.sin(t*2+i)*0.3*d;f.position.y=Math.abs(Math.sin(t*4+i))*0.12;
    const punch=Math.max(0,Math.sin(t*5+i*Math.PI));f.userData.fist.position.x=(i?-1:1)*(0.38+punch*0.35);
    tags[i].sp.position.set(f.position.x+(i?0.45:-0.45),opts.fighters?2.05:1.3,0);});
  logo.rotation.z=t*0.4;logo2.rotation.z=-t*0.7;

  const ra=t-roundStart,wa=t-winT;let flash=0,bt='',bc=PINK,local=0,fade=1;
  if(wa<3.5){bt=winText;bc=winCol;local=wa;flash=Math.max(0,0.9-wa*0.5);fade=wa>3.1?Math.max(0,(3.5-wa)/0.4):1;}
  else if(ra<3.2){const ph=ra<1.4;bt=ph?'ROUND '+roundNum:'FIGHT!';bc=ph?AMBER:PINK;local=ph?ra:ra-1.4;flash=ph?0.3:Math.max(0,1-local*1.5);fade=ra>2.8?Math.max(0,(3.2-ra)/0.4):1;}
  if(bt){
    if(bt+bc!==roundPhase){roundPhase=bt+bc;drawRoundText(bt,bc);}
    roundMesh.visible=true;const sc=local<0.25?0.4+local*2.4:1+Math.sin(local*8)*0.03;
    roundMesh.scale.setScalar(sc);roundMesh.quaternion.copy(camera.quaternion);roundMesh.material.opacity=fade;
  }else{roundMesh.visible=false;roundPhase='';}
  if(!curAlert&&alertQueue.length){curAlert=alertQueue.shift();alertStart=t;}
  if(curAlert&&t-alertStart>7)curAlert=null;
  const alertFlash=curAlert?0.5+0.5*Math.sin((t-alertStart)*10):0;
  spots.forEach((s,i)=>{s.children[0].material.opacity=0.045+0.02*Math.abs(Math.sin(t*1.1+i))+flash*0.08+alertFlash*0.05;s.rotation.z=Math.sin(t*0.35+i*1.7)*0.4;s.rotation.x=Math.cos(t*0.27+i)*0.25;});
  ringSpot.material.opacity=0.05+flash*0.2;
  stageGlow.material.opacity=0.12+flash*0.3;
  padRing.material.color.setHSL(wa<3.5?(winCol===CYAN?0.52:0.88):(ra<3.2?0.88:0.52),1,wa<3.5?0.5+0.2*Math.abs(Math.sin(wa*8)):0.55);
  beacon.visible=Math.floor(t*1.2)%2===0;
  ['chat','alerts'].forEach((id,i)=>{const s=screens[id];s.g.position.y=s.baseY+Math.sin(t*1.2+i)*0.12;});
  screens.alerts.glowMat.opacity=0.3+alertFlash*0.5;
  if(screens.cam.dot)screens.cam.dot.visible=Math.floor(t*2)%2===0;

  const ra2=rainGeo.attributes.position.array;for(let i=0;i<RN;i++){ra2[i*6+1]-=dt*22;ra2[i*6+4]-=dt*22;if(ra2[i*6+1]<0){ra2[i*6+1]+=32;ra2[i*6+4]+=32;}}rainGeo.attributes.position.needsUpdate=true;

  ['game','cam'].forEach(id=>{const s=screens[id];if(s.video&&!s.fitted)s.fitted=fitVideo(s);});
  if(t-lastDraw>1/30){lastDraw=t;
    if(!screens.game.video)drawGameDemo(screens.game,t);
    if(!screens.cam.video)drawCamDemo(screens.cam,t);
    drawViz(screens.viz,t);drawAlerts(screens.alerts,t);
  }
  if(t-lastSlow>0.25){lastSlow=t;drawChat(screens.chat,t);drawBrand(screens.brand,t);drawScore(screens.score);drawInfo(screens.info,t);}

  renderer.render(scene,camera);requestAnimationFrame(loop);
}
refreshDevices().then(async()=>{
  for(const id of ['game','cam']){const saved=store.get('src_'+id,'demo');const sel=$(id==='game'?'srcGame':'srcCam');
    if(saved!=='demo'&&[...sel.options].some(o=>o.value===saved)){sel.value=saved;setSource(id,saved);}}
  if(params.get('game'))await pickByName('game',params.get('game'));
  if(params.get('cam'))await pickByName('cam',params.get('cam'));
});
const startChan=params.get('channel')||store.get('chan','');
if(startChan)connectChat(startChan);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
