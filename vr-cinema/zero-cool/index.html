<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero Cool Cinema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: playful night-out, a demo you can poke at
   IDEA: a drive-in screen dropped into Rassir's BEAT//WAVE synthwave worlds
   PICTURE: the live 3D world itself, full screen
   COLOUR and TYPE: night purple, hot pink + cyan neon, pixel title
   LAYOUT: world fills the screen, world picker on top, one control bar at the bottom */
:root{color-scheme:dark;--bg:#0a0002;--ink:#f3f0ff;--pink:#e0213a;--cyan:#22e6ff;--panel:rgba(14,10,30,.84)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.top{position:absolute;top:0;left:0;right:0;padding:14px max(3vw,14px);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
h1{margin:0;font:400 clamp(13px,2.2vw,20px)/1.4 'Press Start 2P',monospace;color:var(--pink);text-shadow:0 0 12px rgba(255,62,165,.6)}
.hint{margin:6px 0 0;font-size:13px;color:#c9c1ea;max-width:44ch}
.worlds{display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto}
.worlds button{min-height:40px;font-size:14px}
.worlds button[aria-pressed=true]{background:var(--cyan);border-color:var(--cyan);color:#001a20}
.bar{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;background:var(--panel);border:1px solid rgba(255,255,255,.1);border-radius:16px;width:min(640px,calc(100% - 24px))}
button,label.btn{font:500 15px Inter,sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:#1a1433;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
button:hover,label.btn:hover{border-color:var(--cyan)}
button:focus-visible,label.btn:focus-within{outline:2px solid var(--cyan);outline-offset:2px}
.primary{background:var(--pink);border-color:var(--pink);color:#1a0010}
button:disabled{opacity:.4;cursor:default}
#file{position:absolute;opacity:0;width:1px;height:1px}
#status{width:100%;text-align:center;font-size:13px;color:#c9c1ea;margin:0}
#loading{position:absolute;inset:0;display:grid;place-items:center;font:400 13px 'Press Start 2P',monospace;color:var(--cyan);pointer-events:none}
#vrslot button{border-color:var(--cyan);background:#0b2a33;color:var(--cyan)}
@media(max-width:600px){.hint{display:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="loading">Loading Zero Cool…</div>
<div class="top">
  <div>
    <h1>Zero Cool cinema</h1>
    <p class="hint">Inside Zero Cool in Lucid State City. Load an MP4: the house lights go down, the screen lights up the room, and the sound comes from the screen. In VR, trigger plays or pauses and grip toggles the crowd.</p>
  </div>
  
</div>
<div class="bar">
  <label class="btn primary" for="file">Load video<input id="file" type="file" accept="video/*"></label>
  <button id="play" disabled>Play</button>
  <button id="mute" disabled>Sound on</button>
  <button id="seat">Reset seat</button>
  <button id="crowd">Crowd: on</button>
  <span id="vrslot"></span>
  <p id="status">No video loaded yet</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
{
const stage = document.getElementById('stage');
const statusEl = document.getElementById('status');
const loadingEl = document.getElementById('loading');
const playBtn = document.getElementById('play');
const muteBtn = document.getElementById('mute');

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.xr.enabled = true;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05000a);

const camera = new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 1200);
const rig = new THREE.Group();
rig.add(camera);
scene.add(rig);

const SEAT = new THREE.Vector3(-17, 0.3, -22.5);
const LOOK = new THREE.Vector3(-33, 5.5, -22.5);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 0.5; controls.maxDistance = 18;
function resetSeat(){ camera.position.set(SEAT.x, SEAT.y+1.7, SEAT.z); controls.target.copy(LOOK); controls.update(); }
resetSeat();

scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const red = new THREE.PointLight(0xd0102a, 1.2, 30); red.position.set(-23, 9, -22.5); scene.add(red);

const idle = document.createElement('canvas'); idle.width = 1280; idle.height = 720;
const g = idle.getContext('2d');
g.fillStyle = '#0a0002'; g.fillRect(0,0,1280,720);
g.strokeStyle = '#d0102a'; g.lineWidth = 8; g.strokeRect(40,40,1200,640);
g.fillStyle = '#ff3047'; g.font = 'bold 72px sans-serif'; g.textAlign = 'center';
g.fillText('ZERO COOL CINEMA', 640, 330);
g.fillStyle = '#e8c9cd'; g.font = '36px sans-serif';
g.fillText('Load a video to play it here', 640, 410);
const idleTex = new THREE.CanvasTexture(idle); idleTex.flipY = false; idleTex.encoding = THREE.sRGBEncoding;
const screenMat = new THREE.MeshBasicMaterial({map:idleTex, toneMapped:false});

const SCREENS = ['SCREEN_GAMEPLAY_ZC1','SCREEN_GAMEPLAY_ZC2'];
const ambient = scene.children.find(o => o.isAmbientLight);
const glowL = new THREE.PointLight(0xffffff, 0, 34), glowR = new THREE.PointLight(0xffffff, 0, 34);
glowL.position.set(-29, 6, -26); glowR.position.set(-29, 6, -19); scene.add(glowL, glowR);
const screenCenter = new THREE.Vector3(-33.4, 6.9, -22.5);
const listener = new THREE.AudioListener(); camera.add(listener);
const sound = new THREE.PositionalAudio(listener);
sound.setRefDistance(10); sound.setRolloffFactor(0.6);
let glowMats = [], citizens = [], crowdOn = true;

function applyCrowd(){
  citizens.forEach(c => {
    const p = new THREE.Vector3(); c.getWorldPosition(p);
    const blocking = p.x < SEAT.x + 1.5 && Math.abs(p.z - SEAT.z) < 3.2;
    c.visible = crowdOn && !blocking;
  });
}
new THREE.GLTFLoader().load('world.glb', gltf => {
  const root = gltf.scene;
  SCREENS.forEach(n => { const o = root.getObjectByName(n); if(o) o.traverse(m => { if(m.isMesh) m.material = screenMat; }); });
  const main = root.getObjectByName('SCREEN_GAMEPLAY_ZC1');
  if(main){ main.updateWorldMatrix(true,true); new THREE.Box3().setFromObject(main).getCenter(screenCenter); }
  sound.position.copy(screenCenter).add(new THREE.Vector3(0.5,0,0)); scene.add(sound);
  const seen = new Set();
  root.traverse(m => {
    if(!m.isMesh || m.material === screenMat) return;
    (Array.isArray(m.material) ? m.material : [m.material]).forEach(mt => {
      if(seen.has(mt)) return; seen.add(mt);
      if(mt.emissive) mt.userData.e0 = mt.emissiveIntensity;
      if(mt.isMeshBasicMaterial || (mt.emissive && mt.emissive.getHex() > 0)) mt.userData.c0 = mt.color.clone();
      glowMats.push(mt);
    });
  });
  root.children.forEach(c => { if(/^CITIZEN/.test(c.name)) citizens.push(c); });
  scene.add(root);
  applyCrowd();
  loadingEl.remove();
}, p => {
  if(p.total) loadingEl.textContent = 'Loading Zero Cool… ' + Math.round(p.loaded/p.total*100) + '%';
}, () => { loadingEl.textContent = 'Could not load the world file'; });

const video = document.createElement('video');
video.playsInline = true; video.loop = true;
let videoTex = null, lastUrl = null;

document.getElementById('file').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  if(lastUrl) URL.revokeObjectURL(lastUrl);
  lastUrl = URL.createObjectURL(f);
  video.src = lastUrl; video.muted = false;
  try { listener.context.resume(); if(!sound.source) sound.setMediaElementSource(video); } catch(err) {}
  statusEl.textContent = 'Loading ' + f.name + '…';
  const fail = () => { statusEl.textContent = 'This browser could not play that file. Try an H.264 MP4.'; };
  video.onerror = fail;
  video.play().then(onPlaying).catch(() => { video.muted = true; video.play().then(onPlaying).catch(fail); });
  function onPlaying(){
    if(!videoTex){ videoTex = new THREE.VideoTexture(video); videoTex.flipY = false; videoTex.encoding = THREE.sRGBEncoding; }
    screenMat.map = videoTex; screenMat.needsUpdate = true;
    playBtn.disabled = false; muteBtn.disabled = false;
    playBtn.textContent = 'Pause';
    muteBtn.textContent = video.muted ? 'Sound on' : 'Mute';
    statusEl.textContent = 'Now playing: ' + f.name;
  }
});
playBtn.addEventListener('click', () => {
  if(video.paused){ video.play(); playBtn.textContent = 'Pause'; } else { video.pause(); playBtn.textContent = 'Play'; }
});
muteBtn.addEventListener('click', () => { video.muted = !video.muted; muteBtn.textContent = video.muted ? 'Sound on' : 'Mute'; });
document.getElementById('seat').addEventListener('click', resetSeat);
const crowdBtn = document.getElementById('crowd');
crowdBtn.addEventListener('click', () => { crowdOn = !crowdOn; crowdBtn.textContent = crowdOn ? 'Crowd: on' : 'Crowd: off'; applyCrowd(); });
function togglePlay(){ if(!videoTex) return; playBtn.click(); }

for(let i = 0; i < 2; i++){
  const c = renderer.xr.getController(i);
  c.addEventListener('selectstart', togglePlay);
  c.addEventListener('squeezestart', () => crowdBtn.click());
  rig.add(c);
}

const sampler = document.createElement('canvas'); sampler.width = 16; sampler.height = 9;
const sctx = sampler.getContext('2d', {willReadFrequently:true});
const leftC = new THREE.Color(), rightC = new THREE.Color();
let tick = 0, house = 1, glowAmt = 0; const clock = new THREE.Clock();
function sampleScreen(){
  if(!videoTex || video.readyState < 2) return;
  sctx.drawImage(video, 0, 0, 16, 9);
  const d = sctx.getImageData(0, 0, 16, 9).data;
  const sum = [[0,0,0],[0,0,0]];
  for(let y = 0; y < 9; y++) for(let x = 0; x < 16; x++){
    const k = (y*16+x)*4, s = sum[x < 8 ? 0 : 1];
    s[0] += d[k]; s[1] += d[k+1]; s[2] += d[k+2];
  }
  leftC.setRGB(sum[0][0]/18360, sum[0][1]/18360, sum[0][2]/18360);
  rightC.setRGB(sum[1][0]/18360, sum[1][1]/18360, sum[1][2]/18360);
}

const vrBtn = document.createElement('button');
vrBtn.textContent = 'Enter VR'; vrBtn.disabled = true;
document.getElementById('vrslot').appendChild(vrBtn);
let xrSession = null;
if(navigator.xr){
  navigator.xr.isSessionSupported('immersive-vr').then(ok => {
    vrBtn.disabled = !ok; if(!ok) vrBtn.textContent = 'VR not available here';
  }).catch(() => { vrBtn.textContent = 'VR not available here'; });
} else { vrBtn.textContent = 'VR not available here'; }
vrBtn.addEventListener('click', async () => {
  if(xrSession){ xrSession.end(); return; }
  try {
    xrSession = await navigator.xr.requestSession('immersive-vr', {optionalFeatures:['local-floor']});
    xrSession.addEventListener('end', () => { xrSession = null; vrBtn.textContent = 'Enter VR'; });
    await renderer.xr.setSession(xrSession);
    vrBtn.textContent = 'Exit VR';
  } catch(err) { statusEl.textContent = 'Could not start VR in this browser.'; }
});
renderer.xr.addEventListener('sessionstart', () => { rig.position.copy(SEAT); rig.rotation.y = Math.PI/2; });
renderer.xr.addEventListener('sessionend', () => { rig.position.set(0,0,0); rig.rotation.y = 0; resetSeat(); });

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

renderer.setAnimationLoop(() => {
  if(!renderer.xr.isPresenting) controls.update();
  const playing = videoTex && !video.paused;
  if(++tick % 4 === 0) sampleScreen();
  const dt = Math.min(clock.getDelta(), 0.1);
  house += ((playing ? 0 : 1) - house) * Math.min(1, dt * 1.2);
  glowAmt += ((playing ? 1 : 0) - glowAmt) * Math.min(1, dt * 2);
  const lvl = 0.04 + 0.96 * house;
  glowMats.forEach(m => {
    if(m.userData.e0 !== undefined) m.emissiveIntensity = m.userData.e0 * lvl;
    if(m.userData.c0 && m.isMeshBasicMaterial) m.color.copy(m.userData.c0).multiplyScalar(lvl);
  });
  ambient.intensity = 0.06 + 0.29 * house;
  red.intensity = 1.2 * house;
  glowL.color.lerp(leftC, 0.25); glowR.color.lerp(rightC, 0.25);
  glowL.intensity = glowR.intensity = 3.2 * glowAmt;
  renderer.render(scene, camera);
});
}
</script>
</body>
</html>
