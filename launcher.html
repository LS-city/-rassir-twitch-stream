<!doctype html>
<html><head><meta charset="utf-8"><title>Lucid State City</title>
<style>html,body{margin:0;background:transparent;color:#fff;font:16px monospace}</style></head>
<body>
<script>
// Always opens the newest version of the arena (or ?world=city for Lucid State City), so OBS never needs a new link.
(async()=>{
  const q=location.search;
  const page=new URLSearchParams(q).get('world')==='city'?'city.html':'arena.html';
  const go=sha=>location.replace('https://raw.githack.com/LS-city/-rassir-twitch-stream/'+sha+'/'+page+q);
  try{
    const r=await fetch('https://api.github.com/repos/LS-city/-rassir-twitch-stream/commits/main',{cache:'no-store'});
    const j=await r.json();
    if(j&&j.sha){try{localStorage.setItem('nha_lastsha',j.sha);}catch(e){}go(j.sha);return;}
  }catch(e){}
  try{   // GitHub's API allows only 60 checks an hour: fall back to latest.txt (no limit)
    const t=(await (await fetch('https://raw.githubusercontent.com/LS-city/-rassir-twitch-stream/main/latest.txt?t='+Date.now(),{cache:'no-store'})).text()).trim();
    if(/^[0-9a-f]{40}$/.test(t)){go(t);return;}
  }catch(e){}
  go('main');   // GitHub didn't answer (rate limit): the main branch is newer than any remembered version
})();
</script>
</body></html>
